services:
  db:
    image: postgres:16
    container_name: tasks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - tasks_pgdata:/var/lib/postgresql/data

volumes:
  tasks_pgdata: